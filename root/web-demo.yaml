# Demo workload on the apps cluster: nginx behind an HTTPRoute (Gateway API).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: web-demo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:                     # one Application per registered cluster matching:
      selector:
        matchLabels:
          platform: "true"
          role: apps
  template:
    metadata:
      name: 'web-demo-{{.name}}'
      labels:
        component: web-demo
    spec:
      project: workloads
      source:
        repoURL: https://github.com/vjrajendran/k8s-platform-lab.git
        path: apps/web-demo
        targetRevision: main
      destination:
        server: '{{.server}}'
        namespace: web-demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true                  # big CRDs don't fit client-side apply annotations
        - SkipDryRunOnMissingResource=true      # e.g. a ClusterIssuer before cert-manager's CRDs exist
        retry:                                  # components come up in any order - retry until their dependencies exist
          limit: 20
          backoff: {duration: 20s, factor: 2, maxDuration: 5m}
