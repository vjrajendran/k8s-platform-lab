# ClusterIssuers: a self-signed root and a lab CA that signs everything else.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cert-manager-issuers
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:                     # one Application per registered cluster matching:
      selector:
        matchLabels:
          platform: "true"
  template:
    metadata:
      name: 'cert-manager-issuers-{{.name}}'
      labels:
        component: cert-manager-issuers
    spec:
      project: platform
      source:
        repoURL: https://github.com/vjrajendran/k8s-platform-lab.git
        path: addons/cert-manager-issuers
        targetRevision: main
      destination:
        server: '{{.server}}'
        namespace: cert-manager
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true                  # big CRDs don't fit client-side apply annotations
        - SkipDryRunOnMissingResource=true      # e.g. a ClusterIssuer before cert-manager's CRDs exist
        retry:                                  # components come up in any order - retry until their dependencies exist
          limit: 20
          backoff: {duration: 20s, factor: 2, maxDuration: 5m}
