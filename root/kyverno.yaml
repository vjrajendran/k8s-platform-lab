# Kyverno: policy engine (admission control) - validates, mutates and generates resources.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kyverno
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - clusters:                     # one Application per registered cluster matching:
      selector:
        matchLabels:
          platform: "true"
  template:
    metadata:
      name: 'kyverno-{{.name}}'
      labels:
        component: kyverno
    spec:
      project: platform
      sources:
      - repoURL: https://kyverno.github.io/kyverno/
        chart: kyverno
        targetRevision: 3.9.1
        helm:
          releaseName: kyverno
          valueFiles:                         # common, then per cluster type, then per role
          - $values/addons/kyverno/values.yaml
          - $values/addons/kyverno/values-{{index .metadata.labels "type"}}.yaml
          - $values/addons/kyverno/values-{{index .metadata.labels "role"}}.yaml
          ignoreMissingValueFiles: true
      - repoURL: https://github.com/vjrajendran/k8s-platform-lab.git
        targetRevision: main
        ref: values                           # "$values" above = this repo
      destination:
        server: '{{.server}}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true                  # big CRDs don't fit client-side apply annotations
        - SkipDryRunOnMissingResource=true      # e.g. a ClusterIssuer before cert-manager's CRDs exist
        retry:                                  # components come up in any order - retry until their dependencies exist
          limit: 20
          backoff: {duration: 20s, factor: 2, maxDuration: 5m}
