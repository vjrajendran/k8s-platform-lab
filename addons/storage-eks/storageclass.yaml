apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com           # the EBS CSI driver (EKS add-on, from Terraform)
volumeBindingMode: WaitForFirstConsumer # create the volume in the zone where the pod runs
allowVolumeExpansion: true
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"
