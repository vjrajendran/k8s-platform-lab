crds:
  enabled: true               # Certificate, Issuer, ClusterIssuer, CertificateRequest, Order, Challenge
  keep: true                  # don't delete the CRDs (and every certificate) if the app is removed

resources:
  requests: {cpu: 10m, memory: 48Mi}
  limits: {memory: 192Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 24Mi}
    limits: {memory: 96Mi}
cainjector:
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {memory: 192Mi}
